name: Auto Fix (Linting & CodeQL Issues)
on:
  pull_request:
    paths:
      - "**.py"
      - "**.js"
      - "**.ts"
      - "**.tsx"
      - "**.jsx"
      - "**.json"
      - "**.yml"
      - "**.yaml"

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fix Python code
        run: |
          pip install ruff
          ruff check --fix . || echo "Ruff encountered some issues but continuing..."

      - name: Fix JavaScript/TypeScript code
        run: |
          npm install -g prettier
          # Only format JavaScript/TypeScript files that exist
          echo "Formatting JavaScript/TypeScript files..."
          find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" | head -20 | while read file; do
            echo "Formatting: $file"
            prettier --write "$file" || echo "Failed to format $file, continuing..."
          done
          echo "JavaScript/TypeScript formatting completed"

      - name: Check for changes
        id: lint-git-check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            git status --porcelain
          else
            echo "No changes detected"
          fi

      - name: Commit linting fixes
        if: steps.lint-git-check.outputs.changes == 'true'
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ACTIONS_BOT_PAT }} # gitleaks:allow
        run: |
          # Check if we have a valid token
          if [ -z "$GIT_AUTH_TOKEN" ]; then
            echo "Warning: ACTIONS_BOT_PAT secret not available. Cannot commit changes."
            echo "This is expected for external contributors. Changes will be shown in the PR."
            exit 0
          fi

          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are actually changes to commit
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit after all."
            exit 0
          fi

          # Set up authentication and push
          git remote set-url origin https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${{ github.repository }}
          git add .
          git commit -m "Auto-fix linting issues" || {
            echo "Failed to commit changes. This might be due to no actual changes or permission issues."
            exit 0
          }
          git push || {
            echo "Failed to push changes. This might be due to permission issues or branch protection."
            exit 0
          }

  fix-codeql-issues:
    if: false  # Disabled for pull_request triggers
    name: Fix CodeQL Issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Remove cache: 'pip' to avoid cache folder path issues

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Remove virtual environment directories and node_modules
        run: |
          find . -type d \( -name ".venv" -o -name "venv" -o -name "env" -o -name ".env" -o -name "virtualenv" -o -name "node_modules" \) -exec echo "Removing {} ..." \; -exec rm -rf {} \; 2>/dev/null || true

      - name: Create .codeqlignore
        run: |
          cat > .codeqlignore << 'EOL'
          # (snip) - same content as previous script
          .venv/**
          venv/**
          env/**
          .env/**
          **/virtualenv/**
          **/site-packages/**
          **/dist-packages/**
          **/node_modules/**
          **/dist/**
          **/build/**
          **/vendor/**
          **/external/**
          **/third_party/**
          **/__pycache__/**
          **/.pytest_cache/**
          **/.mypy_cache/**
          **/.ruff_cache/**
          **/*.pyc
          **/*.pyo
          **/*.pyd
          **/test/**
          **/tests/**
          **/__tests__/**
          **/__mocks__/**
          **/*.test.js
          **/*.test.ts
          **/*.test.jsx
          **/*.test.tsx
          **/*.spec.js
          **/*.spec.ts
          **/*.spec.jsx
          **/*.spec.tsx
          **/.github/**
          **/.vscode/**
          **/.idea/**
          **/coverage/**
          **/.git/**
          **/docs/**
          **/*.md
          **/*.mdx
          **/*.rst
          **/sphinx/**
          **/playwright-report/**
          **/generated/**
          **/sarif-results/**
          **/*.sarif
          **/*.sarif.json
          ui/react_frontend/node_modules/**
          sdk/javascript/node_modules/**
          EOL

      - name: Check for changes
        id: codeql-git-check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            git status --porcelain
          else
            echo "No changes detected"
          fi

      - name: Commit CodeQL fixes
        if: steps.codeql-git-check.outputs.changes == 'true'
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ACTIONS_BOT_PAT }} # gitleaks:allow
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${{ github.repository }}
          git add .
          git commit -m "Auto-fix CodeQL issues"
          git push
