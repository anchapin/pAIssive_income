name: Ensure Fixed CodeQL Workflows

on:
  pull_request:
    branches: [ main, dev, master, develop ]
    paths:
      - '.github/workflows/codeql*.yml'
      - '.github/scripts/ensure-fixed-codeql-workflows.sh'
      - '.github/scripts/ensure-fixed-codeql-workflows.ps1'
      - '.github/workflows/ensure-codeql-fixed.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ensure-fixed-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make script executable
        run: |
          if [ -f ".github/scripts/ensure-fixed-codeql-workflows.sh" ]; then
            chmod +x .github/scripts/ensure-fixed-codeql-workflows.sh
            echo "Made bash script executable"
          else
            echo "Bash script not found, will try PowerShell script"
          fi

      - name: Run script to ensure fixed CodeQL workflows
        run: |
          echo "Checking for available scripts..."
          ls -la .github/scripts/ensure-fixed-codeql-workflows.*

          if [ -f ".github/scripts/ensure-fixed-codeql-workflows.sh" ]; then
            echo "Running bash script..."
            ./.github/scripts/ensure-fixed-codeql-workflows.sh
          elif [ -f ".github/scripts/ensure-fixed-codeql-workflows.ps1" ]; then
            echo "Running PowerShell script with pwsh..."
            if command -v pwsh >/dev/null 2>&1; then
              pwsh -File .github/scripts/ensure-fixed-codeql-workflows.ps1
            else
              echo "PowerShell not available, skipping"
              exit 0
            fi
          else
            echo "No script found, skipping workflow replacement"
            exit 0
          fi
          echo "Script execution completed"

      - name: Check for changes
        id: check-changes
        run: |
          git add .github/workflows/codeql*.yml || true
          if git diff --cached --exit-code; then
            echo "No changes detected"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Auto-fix: Replace CodeQL workflows with fixed versions" || {
            echo "Commit failed, possibly no changes to commit"
            exit 0
          }
          git push || {
            echo "Push failed, possibly due to branch protection or permissions"
            echo "Changes were made but could not be pushed automatically"
            exit 0
          }
