name: "Unified CodeQL Configuration"

# This configuration file provides unified settings for CodeQL analysis
# across all operating systems and languages

# Query filters
queries:
  # Include the standard security and quality queries
  - uses: security-and-quality

  # Include additional security queries
  - uses: security-extended

  # Use standard security queries
  - uses: security

# Disable noisy alerts
disable-default-queries: false

# Paths to ignore during analysis
paths-ignore:
  # Dependencies and build artifacts
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/.venv/**'
  - '**/venv/**'
  - '**/env/**'
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
  - '**/.mypy_cache/**'
  - '**/.ruff_cache/**'

  # Test files
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/*.test.js'
  - '**/*.test.ts'
  - '**/*.test.jsx'
  - '**/*.test.tsx'
  - '**/*.spec.js'
  - '**/*.spec.ts'
  - '**/*.spec.jsx'
  - '**/*.spec.tsx'
  - '**/*.test.py'
  - '**/*.spec.py'
  - 'test_mem0_integration.py'

  # Documentation and configuration
  - '**/docs/**'
  - '**/*.md'
  - '**/*.rst'
  - '**/.github/**'
  - '**/.vscode/**'
  - '**/.idea/**'

  # Generated files
  - '**/playwright-report/**'
  - '**/sarif-results/**'
  - '**/*.sarif'
  - '**/*.sarif.json'

# Trap errors during extraction
trap-for-errors: true