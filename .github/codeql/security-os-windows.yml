name: "CodeQL Configuration for Windows"

# This configuration file customizes the CodeQL analysis for Windows
# It provides Windows-specific settings and path exclusions

# Windows-specific settings
os: windows-latest

# Paths to ignore during analysis
paths-ignore:
  # Dependencies and build artifacts
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/.venv/**'
  - '**/venv/**'
  - '**/env/**'
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
  - '**/.mypy_cache/**'
  - '**/.ruff_cache/**'

  # Test files
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/*.test.js'
  - '**/*.test.ts'
  - '**/*.test.jsx'
  - '**/*.test.tsx'
  - '**/*.spec.js'
  - '**/*.spec.ts'
  - '**/*.spec.jsx'
  - '**/*.spec.tsx'
  - '**/*.test.py'
  - '**/*.spec.py'
  - 'test_mem0_integration.py'

  # Documentation and configuration
  - '**/docs/**'
  - '**/*.md'
  - '**/*.rst'
  - '**/.github/**'
  - '**/.vscode/**'
  - '**/.idea/**'

  # Generated files
  - '**/playwright-report/**'
  - '**/sarif-results/**'
  - '**/*.sarif'
  - '**/*.sarif.json'

  # Windows specific files
  - '**/*.exe'
  - '**/*.dll'
  - '**/*.obj'
  - '**/*.pdb'
  - '**/*.lib'
  - '**/*.exp'
  - '**/*.ilk'
  - '**/*.res'
  - '**/*.pch'
  - '**/*.idb'
  - '**/*.manifest'
  - '**/*.msi'
  - '**/*.msm'
  - '**/*.msp'
  - '**/*.lnk'
  - '**/Thumbs.db'
  - '**/ehthumbs.db'
  - '**/Desktop.ini'
  - '**/System Volume Information/**'
  - '**/NTUSER.DAT*'
  - '**/ntuser.dat*'
  - '**/ntuser.ini'
  - '**/pagefile.sys'
  - '**/hiberfil.sys'
  - '**/swapfile.sys'

# Query filters
queries:
  # Include the standard security and quality queries
  - uses: security-and-quality

  # Include additional security queries
  - uses: security-extended

  # Use standard security queries
  - uses: security

# Disable noisy alerts
disable-default-queries: false

# Query suite definitions
query-filters:
  - exclude:
      tags contain: test
  - exclude:
      tags contain: maintainability
      precision below: high

# Trap errors during extraction
trap-for-errors: true
